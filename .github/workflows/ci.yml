name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          args: "format --check --diff"

      - name: Codespell
        run: uv run codespell

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }}

      - name: mypy
        run: uv run mypy custom_components/supernotify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            ha-version: "2026.4"
            ha-override: "2026.4.*"
          - python-version: "3.14"
            ha-version: "2026.10"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get install -y libturbojpeg
          uv sync --dev --python ${{ matrix.python-version }}

      # --no-config: otherwise the override-dependencies in pyproject.toml silently keep the locked
      # homeassistant; the test harness has to move with it, as it is built against one HA release
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        if: matrix.ha-override
        run: |
          uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" pytest-homeassistant-custom-component
          uv run --no-sync python -c "import homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith('${{ matrix.ha-version }}.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: pytest
        run: |
          uv run --no-sync pytest \
            --junitxml=junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml \
            --cov=custom_components.supernotify \
            --cov-report=xml \
            --cov-report=html

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}
          path: junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml
