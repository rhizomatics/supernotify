name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # the release workflow runs this on the tag before building
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml and mise.lock are the one source of the tools - ruff, ty, codespell, prek, uv and Python
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        # the versions in mise.lock, as used locally, rather than whatever is latest today
        env:
          MISE_LOCKED: 1

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: ruff check --output-format=github
      - name: Ruff format
        run: ruff format --check --diff

      - name: Codespell
        run: codespell

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml and mise.lock are the one source of the tools - ruff, ty, prek, uv and Python
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        # the versions in mise.lock, as used locally, rather than whatever is latest today
        env:
          MISE_LOCKED: 1

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }}

      - name: mypy
        run: uv run mypy custom_components/supernotify

      - name: ty
        run: ty check

  test:
    runs-on: ubuntu-latest
    # a failure here doesn't fail ci-ok for a row still waiting on its test harness
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            ha-version: "2026.5"
            ha-override: "2026.5.*"
          - python-version: "3.14"
            ha-version: "2026.10"
          - python-version: "3.14"
            ha-version: "2026.11"
            ha-override: "2026.11.*"
            # Home Assistant's own test package, replacing pytest-homeassistant-custom-component
            # from 2026.11 - see tests/components/supernotify/ha_testing.py
            ha-test-package: pytest-homeassistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get install -y libturbojpeg0
          uv sync --dev --python ${{ matrix.python-version }}

      # --no-config: otherwise the override-dependencies in pyproject.toml silently keep the locked
      # homeassistant; the test harness has to move with it, as it is built against one HA release
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        if: matrix.ha-override
        run: |
          if [ "${{ matrix.ha-test-package }}" = "pytest-homeassistant" ]; then
            uv pip uninstall pytest-homeassistant-custom-component
            uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" "pytest-homeassistant==${{ matrix.ha-override }}"
          else
            uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" pytest-homeassistant-custom-component
          fi
          uv run --no-sync python -c "import homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith('${{ matrix.ha-version }}.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: pytest
        run: |
          uv run --no-sync pytest \
            --junitxml=junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml \
            --cov=custom_components.supernotify \
            --cov-report=xml \
            --cov-report=html

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}
          path: junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml

  # The one check branch protection requires, so the lint/test matrix can change without
  # editing the required status checks.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [[ $r == success ]] || exit 1; done
