name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          args: "format --check --diff"

      - name: Codespell
        if: matrix.python-version == '3.14'
        run: uv run codespell

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }}

      - name: mypy
        run: uv run mypy custom_components/supernotify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            ha-version: "2026.2"
          - python-version: "3.14"
            ha-version: "2026.3"
            ha-override: "2026.3.*"
          - python-version: "3.14"
            ha-version: "2026.9"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get install -y libturbojpeg
          uv sync --dev --python ${{ matrix.python-version }}

      - name: Pin Home Assistant ${{ matrix.ha-version }}
        if: matrix.ha-override
        run: uv pip install --no-deps "homeassistant==${{ matrix.ha-override }}"

      - name: pytest
        run: |
          uv run pytest \
            --junitxml=junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml \
            --cov=custom_components.supernotify \
            --cov-report=xml \
            --cov-report=html

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}
          path: junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml
