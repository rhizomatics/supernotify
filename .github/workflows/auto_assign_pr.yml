name: PR assignment

on:
    # pull_request_target rather than pull_request: PRs from forks get a read-only GITHUB_TOKEN
    # under pull_request whatever `permissions` says, so assigning fails with a 403. This job
    # never checks out or runs PR code, which is what makes the elevated token safe here.
    pull_request_target:
        types: [opened, edited, synchronize, reopened]

jobs:
    auto-assign:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            issues: write
        steps:
            - name: 'Auto-assign PR'
              uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: jeyrb
                  numOfAssignee: 1
                  allowSelfAssign: true
