# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Github Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to deploy (e.g. v1.14.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a prerelease?'
        required: true
        type: boolean
        default: false

jobs:
  release-zip:
    # separate from build, and outside its concurrency group, so HACS can download the zip as soon as possible
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Package release zip
      run: |
        cd custom_components/supernotify
        zip -r "${{ github.workspace }}/supernotify.zip" . -x "__pycache__/*" "*/__pycache__/*"
    - name: Upload release zip asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" supernotify.zip --clobber

  build:
    runs-on: ubuntu-latest
    concurrency:
      # PRs don't publish, so they get a per-PR group and a newer push supersedes an older run
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'gh-pages-deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
    - name: HACS Action
      uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"
      with:
        category: "integration"
    - name: HACS Hassfest
      uses: "home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93"
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        sudo apt-get install -y pngquant libturbojpeg
        uv sync
    - name: Ruff
      uses:  astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
    - name: Test with pytest
      run: |
        uv run pytest . --junitxml=junit/test-results-${{ matrix.python-version }}.xml --cov=custom_components.supernotify --cov-report=xml --cov-report=html

    - name: Upload pytest test results
      uses: actions/upload-artifact@v7
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: junit/test-results-${{ matrix.python-version }}.xml
        # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
    - name: Generate badges
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i coverage.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results-${{ matrix.python-version }}.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        git clone --single-branch --branch badges https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . 2>/dev/null
        cp -r ${{ github.workspace }}/badges .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi
      # PRs from forks get a read-only token, and PR results shouldn't overwrite main's badges
      if: ${{ always() && github.event_name != 'pull_request' }}
    - name: Deploy docs
      # run in the build workflow since schemagen has homeassistant dependency
      run: |
        sudo apt-get install pngquant
        uv sync --group docs
        git config push.autoSetupRemote true
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git fetch origin gh-pages
        if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          fi
          if [[ "$IS_PRERELEASE" = "true" ]]; then
            echo "Deploying prerelease version: $TAG"
            uv run mike deploy --update-aliases "$TAG" beta
          else
            echo "Deploying stable release: $TAG"
            uv run mike deploy --update-aliases "$TAG" latest
            uv run mike set-default latest
            # mike only publishes these under the version directory, but crawlers and agents look for them at the site root
            ROOT_FILES="llms.txt llms-full.txt sitemap.xml sitemap.xml.gz robots.txt"
            ROOT_DIR=$(mktemp -d)
            git worktree add "$ROOT_DIR" gh-pages
            for f in $ROOT_FILES; do cp "$ROOT_DIR/$TAG/$f" "$ROOT_DIR/$f"; done
            git -C "$ROOT_DIR" add $ROOT_FILES
            git -C "$ROOT_DIR" commit -m "Publish root llms.txt and sitemap for $TAG" || echo "root files unchanged"
            git worktree remove --force "$ROOT_DIR"
          fi
        else
          echo "Deploying development docs"
          uv run mike deploy --update-aliases dev
        fi
        # PRs only verify the docs build; forks get a read-only token and shouldn't publish dev docs
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          git push origin gh-pages --force-with-lease
        fi

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Export docs site for Pages artifact
      if: ${{ github.event_name != 'pull_request' }}
      run: |
        mkdir site-export
        git archive gh-pages | tar -x -C site-export
    - name: Upload Pages artifact
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: site-export

  deploy-pages:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
