# Dependency updates. Shape shared across rhizomatics repos: see templates/README.md in rhizomatics/.github.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "13:00"
    # Transitive deps (zeroconf, aiohttp, ...) are pinned by homeassistant and
    # differ per Python fork in uv.lock; Dependabot can't bump them per fork.
    allow:
      - dependency-type: direct
    groups:
      python-packages:
        patterns: ["*"]
    cooldown:
      default-days: 5
