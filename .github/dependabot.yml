version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    # Transitive deps (zeroconf, aiohttp, ...) are pinned by homeassistant and
    # differ per Python fork in uv.lock; Dependabot can't bump them per fork.
    allow:
      - dependency-type: "direct"
    groups:
      python-packages:
        patterns:
          - "*"
    cooldown:
      default-days: 5
