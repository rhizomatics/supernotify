[settings]
# tools are locked in mise.lock, as Python dependencies are in uv.lock, so CI runs the versions
# used here, and only those released at least as long ago as uv's exclude-newer in pyproject.toml
lockfile = true
minimum_release_age = "7d"

[tools]
"pipx:codespell" = "latest"
prek = "latest"
python = "3.14"
ruff = { version = "latest", minimum_release_age = "2d" }
ty = { version = "latest", minimum_release_age = "2d" }
uv = { version = "latest", minimum_release_age = "2d" }

[tasks.preview-start]
description = "Start the Docker preview, seeding it as the preview house the first time"
run = "preview/compose.sh up -d"

[tasks.preview-stop]
description = "Stop the Docker preview, keeping its Home Assistant state"
run = "preview/compose.sh down"

[tasks.preview-clean]
description = "Clean all preview state"
run = [    "preview/compose.sh down --remove-orphans",
    "find preview/homeassistant -mindepth 1 -maxdepth 1 ! -name configuration.yaml -exec rm -rf {} +",
]

[tasks.preview-refresh]
description = "Pull the latest Home Assistant image and recreate the preview, keeping its state, with the checkout's Supernotify and ha_repl_server matching uv.lock"
run = ["preview/compose.sh pull", "preview/compose.sh up -d --force-recreate"]

[tasks.preview-rebuild]
description = "Remove the preview, pull the latest Home Assistant image, and start a freshly seeded preview house"
depends = ["preview-clean"]
run = ["preview/compose.sh pull", "preview/compose.sh up -d"]

[tasks.clean]
description = "Remove the Docker preview environment - its containers and Home Assistant state"
depends = ["preview-clean"]
run = [
    "rm -fr site",
    "rm -fr .mypy_cache",
    "rm -fr config",
    "rm -fr .pytest_cache",
    "rm -fr .ropeproject",
    "rm -fr .ruff_cache",
    "rm -fr .pyre",
    "rm -fr .cache",
    "rm -fr htmlcov",
    "rm -f .coverage",
    "rm -f cov.xml",
    "rm -fr custom_components/supernotify.egg-info",
    "find . -type f -name '*.py[co]' -delete -o -type d -name __pycache__ -delete",
    "uv venv .venv --clear",
]
