---
# Quality Scale tracking for Supernotify integration
# Updated: 2026-11-02 (previous updates: 2026-08-06, 2025-12-19)
# Rule set verified against https://contributors.home-assistant.io/core/quality-scale/rules/#checklist
# (HA 2026.10.4; 54 rules). 2026-11-02: no rules added, removed, renamed or moved since 2026-08-06;
# statuses re-checked against the code (2026-Q4 architecture review).
# 2026-08-06 (HA 2026.7): Since 2025-12-19: test-coverage moved Bronze -> Silver, device-class renamed
# entity-device-class, disabled-by-default renamed entity-disabled-by-default, stale-device-removal
# renamed stale-devices, entity-description retired, and Gold gained: discovery, discovery-update-info,
# docs-data-update, docs-examples, docs-known-limitations, docs-supported-devices, docs-supported-functions,
# docs-troubleshooting, docs-use-cases, dynamic-devices, reconfiguration-flow, repair-issues.
# Bronze also gained docs-triggers / docs-conditions.

rules:
  # ==================
  # BRONZE TIER
  # ==================

  action-setup:
    status: todo
    comment: |
      Only supernotify.reload is registered in async_setup (__init__.py). The supernotify.*
      engine actions (actions.py async_register_engine_actions) are registered from
      async_setup_entry and removed in async_unload_entry, so while the entry is not loaded
      they don't exist and automations using them fail validation. The rule wants them
      registered once in async_setup, looking up the loaded entry and raising a translated
      ServiceValidationError when it isn't loaded. notify.supernotify itself is the legacy
      notify service, which follows the entry.

  appropriate-polling:
    status: exempt
    comment: |
      Integration is a notification orchestration service (iot_class: calculated in
      manifest.json). No periodic polling of a device/service required.

  brands:
    status: exempt
    comment: |
      Custom component not seeking official Home Assistant integration status.

  common-modules:
    status: done
    comment: |
      Integration has appropriate structure with model.py, context.py,
      and registry patterns. Coordinator not needed for notification service.

  config-flow:
    status: done
    comment: |
      Immediate phase of configflow_approach RFC implemented: config_flow.py's
      user step reproduces examples/minimal.yaml (all fields optional, everything else
      auto-discovered/auto-generated), with an options flow for archive/dupe_check/
      housekeeping. single_config_entry enforced via manifest.json. Deliveries, transports,
      scenarios, recipients and cameras remain YAML-only - tracked as the Third phase in
      the roadmap doc. The legacy YAML notify platform (async_get_service) keeps working
      unchanged for existing users; a config entry declines to set up if a legacy YAML
      platform already registered notify.supernotify, rather than silently double-registering.

  config-flow-test-coverage:
    status: done
    comment: |
      tests/components/supernotify/test_config_flow.py and test_init.py cover the user
      step, single-instance abort, all three options-flow pages, config-entry setup/unload,
      and the legacy-YAML-coexistence guard - 100% line coverage of config_flow.py and
      __init__.py.

  dependency-transparency:
    status: done
    comment: |
      All dependencies are transparent utility libraries.
      httpx used for user-controlled outbound notifications. bs4 is used for
      HTML parsing in transports/mobile_push.py.

  docs-actions:
    status: done
    comment: |
      Custom services documented at https://supernotify.rhizomatics.org.uk

  docs-conditions:
    status: exempt
    comment: |
      Integration provides no automation condition platform. Scenario conditions
      are an internal YAML construct, not exposed via HA's condition system.

  docs-high-level-description:
    status: done

  docs-installation-instructions:
    status: done
    comment: HACS installation documented.

  docs-removal-instructions:
    status: done
    comment: Getting Started guide now covers removal and cleanup.

  docs-triggers:
    status: exempt
    comment: |
      Integration provides no automation trigger or device trigger platform.

  entity-event-setup:
    status: exempt
    comment: |
      Reviewed: the subscriptions (mobile_app_notification_action, nightly housekeeping
      timer, EVENT_HOMEASSISTANT_STOP - all wired in SupernotifyEngine.initialize(),
      notify.py - and ScenarioRegistry's state tracking of scenario condition entities and
      periodic refresh, in scenario.py) are inherently orchestration-level, not
      scoped to any single entity - they act across all recipients/deliveries. Neither
      SupernotifyEntity nor the per-recipient RecipientNotifyEntity (notify.py, added via the
      notify platform's async_setup_entry) owns any of them - each just delegates
      async_send_message back to the shared SupernotifyEngine.

  entity-unique-id:
    status: done
    comment: |
      Entities properly implement unique_id in __init__.

  has-entity-name:
    status: done
    comment: |
      SupernotifyEntity sets _attr_has_entity_name = True, as do all the entities added by the
      other entity platforms, including the delivery and transport switches and binary_sensors.

  runtime-data:
    status: done
    comment: |
      __init__.py:73 sets entry.runtime_data = service (a SuperNotificationService, which owns
      the Context/registries/transports as a SupernotifyEngine). async_setup_entry/
      async_unload_entry are typed against a SupernotifyConfigEntry = ConfigEntry[
      SupernotifyEngine] alias, decoupled from the legacy BaseNotificationService-derived
      SuperNotificationService shim - see SuperNotificationService's docstring in notify.py.

  test-before-configure:
    status: done
    comment: |
      config_flow.py's _validate_user_input() validates template_path and media_path at
      submission time, mirroring MediaStorage.initialize()'s own tolerant runtime behavior
      (media_grab.py): each directory is created on demand if missing, and only a genuine
      OSError/ValueError creating or accessing it is a form error. A blank value is left
      untouched, since both fields are optional.

  test-before-setup:
    status: done
    comment: |
      async_setup_entry (__init__.py) wraps service.initialize() in try/except, raising
      ConfigEntryNotReady on any failure so HA retries with backoff instead of leaving the
      entry in an unhandled-exception state.

  unique-config-entry:
    status: done
    comment: |
      manifest.json:33 sets single_config_entry: true, HA's sanctioned alternative to
      per-entry unique_id when only one entry is ever meaningful (see config_flow.py's
      own docstring at lines 137-138, which documents the same rationale for the import
      step's duplicate-entry protection).

  # ==================
  # SILVER TIER
  # ==================

  action-exceptions:
    status: done
    comment: |
      supplemental_action_purge_archive/supplemental_action_purge_media (notify.py) raise
      ServiceValidationError when archive/media storage isn't configured, instead of
      returning a soft {"error": ...} dict a caller might not check. notify.supernotify
      itself (async_send_message) deliberately keeps its existing fault-barrier-of-last-
      resort behavior - it's a notify action invoked from automations, where one failed
      delivery raising and halting the calling automation would be worse than the existing
      failure-counter/log approach; not treated as an action-exceptions gap.

  config-entry-unloading:
    status: done
    comment: |
      async_unload_entry (__init__.py) unregisters notify.supernotify (via
      service.async_unregister_services()) and the supplemental supernotify.* services
      (via async_unregister_supplemental_services()), gated on runtime_data having been
      set - i.e. only for entries that actually registered anything themselves.

  docs-configuration-parameters:
    status: done

  docs-installation-parameters:
    status: done

  entity-unavailable:
    status: exempt
    comment: Does not introduce its own transport integrations

  integration-owner:
    status: done

  log-when-unavailable:
    status: done
    comment: |
      Transport.log_delivery_failure()/log_delivery_recovered() (transport.py) log the first
      delivery failure at ERROR and flag the transport unavailable; consecutive failures
      while still unavailable are downgraded to DEBUG instead of repeating at ERROR, and a
      later successful delivery logs one INFO recovery message and clears the flag. Wired
      into transport.py's call_action (used by 16 of 17 transports), transports/smtp.py's
      direct-SMTP _send (the one transport that bypasses call_action), and notification.py's
      outer per-delivery fallback catch. The lifetime error_count/last_error_* attributes
      are untouched - only log level/frequency changed.

  parallel-updates:
    status: done
    comment: |
      PARALLEL_UPDATES = 0 in every entity platform (notify, binary_sensor, sensor, switch,
      button): entities are pushed, never polled, and their actions only change local state.

  reauthentication-flow:
    status: exempt
    comment: |
      Integration orchestrates notifications but doesn't authenticate
      to external services. Individual transports handle their own auth.

  test-coverage:
    status: done
    comment: |
      Moved from Bronze to Silver in the current rule set.
      2026-11-02: 2760 tests pass on HA 2026.10.4 with 97% line coverage.

  # ==================
  # GOLD TIER
  # ==================

  devices:
    status: done
    comment: |
      A single "SuperNotify" device (hass_api.ha_device_info()) now groups the
      scenario, recipient, delivery and transport switches, their binary_sensors
      and the notification/failure counter sensors (switch.py, binary_sensor.py,
      sensor.py), and the reset overrides button (button.py). The recipient notify
      entities (people.py) are not on it.

  diagnostics:
    status: done
    comment: |
      diagnostics.py's async_get_config_entry_diagnostics surfaces the same operational state
      already exposed piecemeal via the supernotify.enquire_* admin services (notify.py) -
      recipients, scenario/delivery routing, snoozes, the last notification sent (in
      diagnostics mode), and the sent/failure counters - through the standard Settings >
      Devices & Services > Supernotify > Download diagnostics flow. Every Person.as_dict()
      identifying field (email, phone_number, user_id, alias) is redacted via
      homeassistant.components.diagnostics.async_redact_data, wherever it turns up nested.

  discovery:
    status: exempt
    comment: |
      Service/orchestration integration with no discoverable network devices.

  discovery-update-info:
    status: exempt
    comment: Not applicable - integration does not support discovery.

  docs-data-update:
    status: todo
    comment: |
      Need a doc section explaining that diagnostic entities (e.g.
      sensor.notifier_whisper_attivo) update on notification/scenario events,
      not on a poll interval.

  docs-examples:
    status: todo
    comment: |
      Rule wants automation blueprints. docs/recipes/ (24 markdown recipes)
      covers similar ground informally but isn't in blueprint-exchange format.

  docs-known-limitations:
    status: done
    comment: README.md has known limitations section

  docs-supported-devices:
    status: exempt
    comment: |
      Service-type integration with no physical devices - rule explicitly
      exempts this case.

  docs-supported-functions:
    status: todo
    comment: |
      Partially covered by docs/usage/actions.md and docs/transports/*, but not
      organized as a single supported-functionality reference per the rule.

  docs-troubleshooting:
    status: todo
    comment: |
      docs/help/troubleshooting.md lists the debugging tools (archive, diagnostics, debug mode,
      enquire actions) but not common symptoms with their causes and fixes, which the rule asks for.

  docs-use-cases:
    status: done
    comment: |
      docs/quick_start/ and docs/recipes/ cover use cases

  dynamic-devices:
    status: exempt
    comment: |
      A single fixed device is created per config entry (see devices); no
      dynamically discovered devices are added after setup.

  entity-category:
    status: done
    comment: |
      Every switch (scenario, recipient, delivery, transport) is EntityCategory.CONFIG via
      SupernotifyOverridableSwitch, as is the reset_overrides button; the scenario and
      recipient binary_sensors, the deprecated delivery/transport binary_sensors and the
      two counter sensors are EntityCategory.DIAGNOSTIC. The recipient notify entities
      deliberately have none, being the primary entity a recipient is notified through.

  entity-device-class:
    status: exempt
    comment: |
      Renamed from device-class. Re-evaluated as exempt rather than done: no
      standard device_class describes any entity here - a scenario switch, a
      scenario's conditions holding, a recipient being enabled, or a unitless
      notification count. binary_sensor.py's SupernotifyRecipientBinarySensor
      deliberately sets none (CONNECTIVITY was tried and dropped - see its
      docstring - it means online/offline reachability, not "enabled for
      delivery", and made a disabled recipient show as "Disconnected").

  entity-disabled-by-default:
    status: done
    comment: |
      Renamed from disabled-by-default. The deprecated delivery/transport binary_sensors, which
      most users don't need, are disabled by default (binary_sensor.py). The scenario and
      recipient entities and the counters are the main state users act on, so stay enabled.

  entity-translations:
    status: done
    comment: |
      Every entity has a translated name via translations/en.json's "entity" section and
      _attr_translation_key - the counter sensors, the reset_overrides button, the
      recipient notify entities, and the scenario, recipient, delivery and transport
      binary_sensors and switches (the scenario/recipient/delivery/transport name being a
      translation placeholder). The type comes first in each name, so each kind sorts
      together in the entity list.

  exception-translations:
    status: done
    comment: |
      Every ServiceValidationError raised by the actions (actions.py) and the setup
      ConfigEntryNotReady (__init__.py) use translation_domain/translation_key, with the
      messages in translations/en.json "exceptions".

  icon-translations:
    status: done
    comment: |
      icons.json covers every entity via _attr_translation_key, including the recipient
      notify entities. Switches and binary_sensors have state icons, so a scenario,
      recipient, delivery or transport that is off looks different from one that is on
      (test_icons.py checks every on/off entity has one).

  reconfiguration-flow:
    status: done
    comment: |
      config_flow.py async_step_reconfigure edits the user-step settings held in entry data,
      using async_update_and_abort so the update listener's reload isn't doubled.
      Covered in tests/components/supernotify/test_config_flow.py.

  repair-issues:
    status: done
    comment: |
      The rule needs issues to be actionable, not fixable. repairs.py has a repair flow for
      migrating legacy YAML (is_fixable=True), and raises actionable issues for deprecated
      binary_sensors, manual migration and an unsupported Python version; scenario.py raises
      them for invalid scenario conditions.

  stale-devices:
    status: exempt
    comment: |
      Renamed from stale-device-removal. The single "SuperNotify" device (see
      devices) is fixed for the lifetime of its config entry - not discovered
      or removable independently of it - so there is nothing that can go
      stale.

  # ==================
  # PLATINUM TIER
  # ==================

  async-dependency:
    status: done
    comment: |
      Pillow and file system actions using either asyncio directly or
      wrapped in HomeAssistant async jobs

  inject-websession:
    status: done
    comment: |
      Properly uses async_get_clientsession(hass) in media_grab.py.

  strict-typing:
    status: todo
    comment: |
      py.typed present and mypy passes, but not in strict mode (no strict settings in
      pyproject.toml), and 14 "# type: ignore" remain (hass_api.py, notification.py,
      media_grab.py, target.py, snoozer.py, scenario.py, llm.py).
