---
# Quality Scale tracking for Supernotify integration
# Updated: 2026-08-06 (previous update: 2025-12-19)
# Rule set verified against https://developers.home-assistant.io/docs/core/integration-quality-scale/checklist
# (HA 2026.7). Since 2025-12-19: test-coverage moved Bronze -> Silver, device-class renamed
# entity-device-class, disabled-by-default renamed entity-disabled-by-default, stale-device-removal
# renamed stale-devices, entity-description retired, and Gold gained: discovery, discovery-update-info,
# docs-data-update, docs-examples, docs-known-limitations, docs-supported-devices, docs-supported-functions,
# docs-troubleshooting, docs-use-cases, dynamic-devices, reconfiguration-flow, repair-issues.
# Bronze also gained docs-triggers / docs-conditions.

rules:
  # ==================
  # BRONZE TIER
  # ==================

  action-setup:
    status: done
    comment: |
      notify.supernotify is registered directly from async_setup_entry() (__init__.py),
      bypassing legacy platform discovery - see build_supernotify_action() in notify.py,
      shared with the still-supported YAML async_get_service() path. The dozen supplemental
      supernotify.* debugging/admin services are now also shared: extracted into
      async_register_supplemental_services()/async_unregister_supplemental_services()
      (notify.py), called from both async_get_service() (YAML) and async_setup_entry/
      async_unload_entry (__init__.py), guarded against double registration.

  appropriate-polling:
    status: exempt
    comment: |
      Integration is a notification orchestration service (iot_class: calculated in
      manifest.json). No periodic polling of a device/service required.

  brands:
    status: exempt
    comment: |
      Custom component not seeking official Home Assistant integration status.

  common-modules:
    status: done
    comment: |
      Integration has appropriate structure with model.py, context.py,
      and registry patterns. Coordinator not needed for notification service.

  config-flow:
    status: done
    comment: |
      Immediate phase of docs/roadmap/configflow_approach.md implemented: config_flow.py's
      user step reproduces examples/minimal.yaml (all fields optional, everything else
      auto-discovered/auto-generated), with an options flow for archive/dupe_check/
      housekeeping. single_config_entry enforced via manifest.json. Deliveries, transports,
      scenarios, recipients and cameras remain YAML-only - tracked as the Third phase in
      the roadmap doc. The legacy YAML notify platform (async_get_service) keeps working
      unchanged for existing users; a config entry declines to set up if a legacy YAML
      platform already registered notify.supernotify, rather than silently double-registering.

  config-flow-test-coverage:
    status: done
    comment: |
      tests/components/supernotify/test_config_flow.py and test_init.py cover the user
      step, single-instance abort, all three options-flow pages, config-entry setup/unload,
      and the legacy-YAML-coexistence guard - 100% line coverage of config_flow.py and
      __init__.py.

  dependency-transparency:
    status: done
    comment: |
      All dependencies are transparent utility libraries.
      httpx used for user-controlled outbound notifications. bs4 is used for
      HTML parsing in transports/mobile_push.py.

  docs-actions:
    status: done
    comment: |
      Custom services documented at https://supernotify.rhizomatics.org.uk

  docs-conditions:
    status: exempt
    comment: |
      Integration provides no automation condition platform. Scenario conditions
      are an internal YAML construct, not exposed via HA's condition system.

  docs-high-level-description:
    status: done

  docs-installation-instructions:
    status: done
    comment: HACS installation documented.

  docs-removal-instructions:
    status: done
    comment: Getting Started guide now covers removal and cleanup.

  docs-triggers:
    status: exempt
    comment: |
      Integration provides no automation trigger or device trigger platform.

  entity-event-setup:
    status: exempt
    comment: |
      Reviewed: the four subscriptions (mobile_app_notification_action, exposed_entities
      state tracking, nightly housekeeping timer, EVENT_HOMEASSISTANT_STOP - all wired in
      SupernotifyAction.initialize(), notify.py) are inherently orchestration-level, not
      scoped to any single entity - they act across all recipients/deliveries. Neither
      SupernotifyEntity nor the per-recipient RecipientNotifyEntity (notify.py, added via the
      notify platform's async_setup_entry) owns any of them - each just delegates
      async_send_message back to the shared SupernotifyAction.

  entity-unique-id:
    status: done
    comment: |
      Entities properly implement unique_id in __init__.

  has-entity-name:
    status: done
    comment: |
      SupernotifyEntity sets _attr_has_entity_name = True.

  runtime-data:
    status: done
    comment: |
      __init__.py:73 sets entry.runtime_data = service (the SupernotifyAction, which owns
      the Context/registries/transports). async_setup_entry/async_unload_entry are typed
      against a SupernotifyConfigEntry = ConfigEntry[SupernotifyAction] alias.

  test-before-configure:
    status: done
    comment: |
      config_flow.py's _validate_user_input() validates template_path and media_path at
      submission time, mirroring MediaStorage.initialize()'s own tolerant runtime behavior
      (media_grab.py): each directory is created on demand if missing, and only a genuine
      OSError/ValueError creating or accessing it is a form error. A blank value is left
      untouched, since both fields are optional.

  test-before-setup:
    status: done
    comment: |
      async_setup_entry (__init__.py) wraps service.initialize() in try/except, raising
      ConfigEntryNotReady on any failure so HA retries with backoff instead of leaving the
      entry in an unhandled-exception state.

  unique-config-entry:
    status: done
    comment: |
      manifest.json:33 sets single_config_entry: true, HA's sanctioned alternative to
      per-entry unique_id when only one entry is ever meaningful (see config_flow.py's
      own docstring at lines 137-138, which documents the same rationale for the import
      step's duplicate-entry protection).

  # ==================
  # SILVER TIER
  # ==================

  action-exceptions:
    status: done
    comment: |
      supplemental_action_purge_archive/supplemental_action_purge_media (notify.py) raise
      ServiceValidationError when archive/media storage isn't configured, instead of
      returning a soft {"error": ...} dict a caller might not check. notify.supernotify
      itself (async_send_message) deliberately keeps its existing fault-barrier-of-last-
      resort behavior - it's a notify action invoked from automations, where one failed
      delivery raising and halting the calling automation would be worse than the existing
      failure-counter/log approach; not treated as an action-exceptions gap.

  config-entry-unloading:
    status: done
    comment: |
      async_unload_entry (__init__.py) unregisters notify.supernotify (via
      service.async_unregister_services()) and the supplemental supernotify.* services
      (via async_unregister_supplemental_services()), gated on runtime_data having been
      set - i.e. only for entries that actually registered anything themselves.

  docs-configuration-parameters:
    status: done

  docs-installation-parameters:
    status: done

  entity-unavailable:
    status: exempt
    comment: Does not introduce its own transport integrations

  integration-owner:
    status: done

  log-when-unavailable:
    status: done
    comment: |
      Transport.log_delivery_failure()/log_delivery_recovered() (transport.py) log the first
      delivery failure at ERROR and flag the transport unavailable; consecutive failures
      while still unavailable are downgraded to DEBUG instead of repeating at ERROR, and a
      later successful delivery logs one INFO recovery message and clears the flag. Wired
      into transport.py's call_action (used by 16 of 17 transports), transports/smtp.py's
      direct-SMTP _send (the one transport that bypasses call_action), and notification.py's
      outer per-delivery fallback catch. The lifetime error_count/last_error_* attributes
      are untouched - only log level/frequency changed.

  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES constant configured (notify.py).

  reauthentication-flow:
    status: exempt
    comment: |
      Integration orchestrates notifications but doesn't authenticate
      to external services. Individual transports handle their own auth.

  test-coverage:
    status: done
    comment: |
      Moved from Bronze to Silver in the current rule set.
      625 test functions across 49 files (up from 208/25 files in Dec 2025).
      Checked-in .coverage report shows 95% total line coverage.

  # ==================
  # GOLD TIER
  # ==================

  devices:
    status: exempt
    comment: This integration does not connect to any devices

  diagnostics:
    status: todo
    comment: |
      Need to create diagnostics.py module once config_entries introduced

  discovery:
    status: exempt
    comment: |
      Service/orchestration integration with no discoverable network devices.

  discovery-update-info:
    status: exempt
    comment: Not applicable - integration does not support discovery.

  docs-data-update:
    status: todo
    comment: |
      Need a doc section explaining that diagnostic entities (e.g.
      sensor.notifier_whisper_attivo) update on notification/scenario events,
      not on a poll interval.

  docs-examples:
    status: todo
    comment: |
      Rule wants automation blueprints. docs/recipes/ (24 markdown recipes)
      covers similar ground informally but isn't in blueprint-exchange format.

  docs-known-limitations:
    status: todo
    comment: No "## Known limitations" section found under docs/.

  docs-supported-devices:
    status: exempt
    comment: |
      Service-type integration with no physical devices - rule explicitly
      exempts this case.

  docs-supported-functions:
    status: todo
    comment: |
      Partially covered by docs/usage/actions.md and docs/transports/*, but not
      organized as a single supported-functionality reference per the rule.

  docs-troubleshooting:
    status: todo
    comment: No dedicated troubleshooting doc found under docs/.

  docs-use-cases:
    status: done
    comment: |
      docs/concepts.md and docs/recipes/ cover use cases

  dynamic-devices:
    status: exempt
    comment: No devices are created by this integration (see devices exemption).

  entity-category:
    status: todo
    comment: |
      Partial: EntityCategory.DIAGNOSTIC now set in notify.py:575 and
      people.py:64. Other entity types not yet reviewed.

  entity-device-class:
    status: done
    comment: |
      Renamed from device-class. people.py:63 sets
      BinarySensorDeviceClass.CONNECTIVITY on the person-availability sensor;
      no other entity has an applicable standard device_class.

  entity-disabled-by-default:
    status: todo
    comment: |
      Renamed from disabled-by-default. No _attr_entity_registry_enabled_default
      usage found - diagnostic/noisy entities are not currently disabled by
      default (correcting a previous incorrect "done" status here).

  entity-translations:
    status: todo
    comment: |
      No "entity" section in strings.json and no _attr_translation_key usage
      found - not started, not partial as previously noted.

  exception-translations:
    status: todo
    comment: |
      Need to add translatable exception messages using translation_key.

  icon-translations:
    status: todo
    comment: |
      No icons.json present. Evaluate if dynamic icons needed based on
      state/ranges.

  reconfiguration-flow:
    status: todo
    comment: |
      New rule. Depends on config-flow landing first; the draft Phase 1 PR
      (design/roadmap/configflow_proposal.md) already includes a reconfigure
      step for global settings (paths, archive, dupe check, discovery toggles).

  repair-issues:
    status: todo
    comment: |
      Partial infrastructure exists: hass_api.py creates repair issues (8 issue
      types registered in strings.json under "issues") but all are currently
      is_fixable=False, i.e. informational rather than the guided/actionable
      fix flows this rule expects.

  stale-devices:
    status: exempt
    comment: |
      Renamed from stale-device-removal. This integration does not connect to
      any devices.

  # ==================
  # PLATINUM TIER
  # ==================

  async-dependency:
    status: done
    comment: |
      Pillow and file system actions using either asyncio directly or
      wrapped in HomeAssistant async jobs

  inject-websession:
    status: done
    comment: |
      Properly uses async_get_clientsession(hass) in media_grab.py.

  strict-typing:
    status: todo
    comment: |
      py.typed present and type hints extensive, but mypy suppressions remain
      widespread (# type: ignore in notification.py, media_grab.py, hass_api.py,
      transport.py, model.py, snoozer.py, scenario.py) - not yet "done".
