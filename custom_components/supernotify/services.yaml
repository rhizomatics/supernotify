reload:
notify:
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    title:
      selector:
        text:
    target:
      selector:
        target:
    priority:
      selector:
        select:
          options:
            - value: critical
              label: Critical
            - value: high
              label: High
            - value: medium
              label: Medium
            - value: low
              label: Low
            - value: minimum
              label: Minimum
    delivery_selection:
      selector:
        select:
          options:
            - value: explicit
              label: Explicit
            - value: fixed
              label: Fixed
            - value: implicit
              label: Implicit
    delivery:
      selector:
        object:
    require_scenarios:
      selector:
        text:
          multiple: true
    apply_scenarios:
      selector:
        text:
          multiple: true
    constrain_scenarios:
      selector:
        text:
          multiple: true
    action_groups:
      selector:
        text:
          multiple: true
    actions:
      selector:
        object:
    media:
      selector:
        object:
    message_html:
      selector:
        text:
          multiline: true
    debug:
      selector:
        boolean:
    force_resend:
      selector:
        boolean:
    data:
      selector:
        object:
enquire_configuration:
enquire_deliveries_by_scenario:
enquire_implicit_deliveries:
enquire_last_notification:
  fields:
    diagnostics:
      required: false
      selector:
        boolean:
enquire_recipients:
enquire_scenarios:
enquire_active_scenarios:
  fields:
    trace:
      required: false
      selector:
        boolean:
