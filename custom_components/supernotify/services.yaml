reload:
notify:
  fields:
    message:
      example: "The front door has been opened"
      required: true
      selector:
        text:
          multiline: true
    title:
      example: "Security"
      selector:
        text:
    target:
      selector:
        target:
    custom_target:
      example: "alice@example.com"
      selector:
        text:
          multiple: true
    priority:
      selector:
        select:
          options:
            - value: critical
              label: Critical
            - value: high
              label: High
            - value: medium
              label: Medium
            - value: low
              label: Low
            - value: minimum
              label: Minimum
    delivery:
      example: "email"
      selector:
        text:
          multiple: true
    multimedia:
      collapsed: false
      fields:
        camera_entity_id:
          example: "camera.front_door"
          selector:
            entity:
              domain: camera
        snapshot_url:
          example: "https://example.com/front_door.jpg"
          selector:
            text:
        clip_url:
          example: "https://example.com/front_door.mp4"
          selector:
            text:
        media:
          example: |
            camera_ptz_preset: front_gate
            camera_delay: 2
          selector:
            object:
    scenarios:
      collapsed: false
      fields:
        require_scenarios:
          example: "night"
          selector:
            text:
              multiple: true
        apply_scenarios:
          example: "night"
          selector:
            text:
              multiple: true
        constrain_scenarios:
          example: "night"
          selector:
            text:
              multiple: true
    advanced:
      collapsed: true
      fields:
        delivery_selection:
          selector:
            select:
              options:
                - value: explicit
                  label: Explicit
                - value: fixed
                  label: Fixed
                - value: implicit
                  label: Implicit
        delivery_config:
          example: |
            email:
              data:
                cc: alice@example.com
          selector:
            object:
        actions:
          example: |
            - action: OPEN_GATE
              title: Open the gate
          selector:
            object:
        action_groups:
          example: "gate_actions"
          selector:
            text:
              multiple: true
        message_html:
          example: "The <b>front door</b> has been opened"
          selector:
            text:
              multiline: true
        spoken_message:
          example: "The front door has been opened"
          selector:
            text:
              multiline: true
        debug:
          selector:
            boolean:
        force_resend:
          selector:
            boolean:
        data:
          selector:
            object:
        timestamp:
          example: "%H:%M"
          selector:
            text:
        extra_data:
          example: "tag: front_door"
          selector:
            object:
enquire_configuration:
enquire_deliveries_by_scenario:
enquire_implicit_deliveries:
enquire_last_notification:
  fields:
    diagnostics:
      required: false
      selector:
        boolean:
enquire_recipients:
enquire_scenarios:
enquire_active_scenarios:
  fields:
    trace:
      required: false
      selector:
        boolean:
enquire_occupancy:
enquire_snoozes:
refresh_entities:
reset_overrides:
  fields:
    kind:
      required: false
      selector:
        select:
          options:
            - value: scenario
              label: Scenario
            - value: recipient
              label: Recipient
            - value: delivery
              label: Delivery
            - value: transport
              label: Transport
clear_snoozes:
purge_media:
  fields:
    days:
      required: false
      example: 5
      selector:
        number:
          min: 0
          unit_of_measurement: days
purge_archive:
  fields:
    days:
      required: false
      example: 5
      selector:
        number:
          min: 0
          unit_of_measurement: days
