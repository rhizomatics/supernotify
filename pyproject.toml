[project]
name = "supernotify"
description = "Home Assistant custom component for unified, simplified and powerful notifications"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.10.0",
    "cachetools",
    "bs4",
    "aiofiles",
]

[tool.poetry]
package-mode = false
packages = [{ include = "custom_components.supernotify" }]

[tool.hatch.version]
path = "custom_components/supernotify/manifest.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.setuptools.packages.find]
where = [
    "custom_components",
] # list of folders that contain the packages (["."] by default)
include = [
    "supernotify*",
] # package names should match these glob patterns (["*"] by default)
exclude = [
    "tests.components.supernotify.*",
] # exclude packages matching these glob patterns (empty by default)
namespaces = true # to disable scanning PEP 420 namespaces (true by default)

[dependency-groups]
dev=[
    "homeassistant-stubs",
    "pytest==9.0.3",
    "pytest-cov",
    "pytest-socket",
    "pytest-homeassistant-custom-component>=0.13.356",
    "pytest-asyncio",
    "pytest-aiohttp==1.1.1",
    "pytest-unordered",
    "pytest-mock",
    "pytest-xdist",
    "pytest-icdiff",
    "icdiff",
    "types-aiofiles",
    "types-cachetools",
    "pre-commit",
    "pytest-httpserver",
    "ruff>=0.16.0",
    "codespell",
    "mypy",
    "genbadge[all]",
    # generic transport testing
    "notify-events",
    "aiontfy==0.8.5",
    # home assistant smtp testing
    "aiosmtplib==5.1.3",
    "zeroconf>=0.150.1",
    # home assistant tts testing
    "mutagen",
    "ha-ffmpeg",
    # home assistant mobile push testing, and ntfy, old ver for HA compat
    "PyTurboJPEG==1.8.3",
    # integration testing
    #"hassil",
    #"gazetteer_matcher",
    #"pymicro_vad",
    #"pyspeex_noise",
    # type checking
    "types-python-slugify>=8.0.2.20240310",
    "voluptuous-stubs>=0.1.1",
    "types-requests>=2.33.0.20260906,<3.0.0.0",
    "types-pillow",
    "types-pyyaml>=6.0.12.20260906,<7.0.0.0",
    "types-beautifulsoup4",
    "homeassistant_repl" # optional developer shell
]
docs=[
    "mkdocs-materialx[imaging]",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-minify-plugin",
    "mkdocs-material-extensions",
    "pymdown-extensions",
    "mkdocs-autorefs",
    "mkdocs-coverage",
    "mkdocs-pagetree-plugin",
    "properdocs[i18n]",
    "json-schema-for-humans",
    "mkdocs-gen-files",
    "probatio",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-html-plugin",
    "mkdocs-meta-descriptions-plugin",
    "mike",
    "mkdocs-htmlproofer-plugin",
    "mkdocs-llmstxt",
    "mkdocs-redirects>=1.2.3,<2.0.0",
]

[project.optional-dependencies]


[tool.uv]
prerelease = "if-necessary"
environments = [
    "python_full_version >= '3.14.2'",
]
override-dependencies = [
    #"voluptuous-openapi==0.2.0"
    # homeassistant==2026.2.3 hard-pins zeroconf==0.148.0 (exact, no range) - that version
    # carries a known CVE, so force the patched 0.149.16 instead for py3.13 (2026.9.2, used
    # for py3.14+, already requires a newer zeroconf range that isn't affected)
    "zeroconf>=0.150.1",
    "homeassistant==2026.10.0",
    "homeassistant-stubs==2026.10.0",

]
exclude-newer = "5 days"
exclude-newer-package = { homeassistant_repl="1 days",ruff="2 days",homeassistant=false,homeassistant-stubs=false,aiohttp=false,uv=false }
add-bounds = "major"

[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py314"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".devcontainer",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".github",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true
ignore=[
    "BLE001", # Blind except
    "SIM117",  # Multiple with statements
    "PLW0108" # lay off the lambdas
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = []
"**/{tests,docs}/*" = [
    "ANN201",
    "ANN204",
    "ANN001",
    "ARG002",
    "ARG001",
    "ANN202",
    "PT004",
    "ARG001",
    "SIM115",
]
"conftest.py" = [
    "ANN201",
    "ANN204",
    "ANN001",
    "ARG002",
    "ARG001",
    "ANN202",
    "PT004",
    "ARG001",
    "SIM115",
]


[tool.ruff.format]
preview = true

[tool.ty.src]
include = ["custom_components/supernotify","tests"]

[tool.ty.rules]
unused-type-ignore-comment="ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"

[tool.codespell]
ignore-words-list = "HASS,hass,wee,alot,NotIn,datas,dof,dur,farenheit,hist,iff,ines,ist,alle,comando,lightsensor,mut,nd,pres,referer,ser,serie,te,technik,ue,uint,visability,wan,wanna,withing,astroid"
# Skip binary/data files, build artifacts, and non-English markdown (locale-named files and locale dirs)
skip = "*.csv,*.json,./.*,./site,./htmlcov,./docs/developer/diagrams,README.??.md,./README.??-??.md,./docs/??/*.md,./docs/??-??/*.md"
quiet-level = 2


[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = 1
log_level = "WARNING"
log_cli_level = "WARNING"
testpaths = ["tests"]
norecursedirs = [".git", "templates"]

addopts = [
    "-n 4",
    "--timeout=30",
    "-cov=custom_components/supernotify",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components.supernotify",
    "--cov-fail-under=80",
    "--verbosity=2",
    "--allow-hosts=127.0.0.1,127.0.1.1,localhost,::1",
]

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["attr-defined", "arg-type", "call-overload", "index", "union-attr"]
