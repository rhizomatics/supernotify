[project]
name = "supernotify"
description = "Home Assistant custom component for unified, simplified and powerful notifications"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.13.2"
dependencies = [
    "homeassistant>=2026.9.0; python_full_version >= '3.14.2'",
    "homeassistant>=2025.10.4,<2026.3.0; python_full_version < '3.14.2'",
    "cachetools",
    "bs4",
    "aiofiles",
    #"pyopenssl==25.3.0", # HA issue 2026.3
    #"requests==2.32.5" # force hass compat
    #"cryptography==48.0.0" # removed: conflicts with HA 2026.5.x which requires 47.0.0
]

[tool.poetry]
package-mode = false
packages = [{ include = "custom_components.supernotify" }]

[tool.hatch.version]
path = "custom_components/supernotify/manifest.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.setuptools.packages.find]
where = [
    "custom_components",
] # list of folders that contain the packages (["."] by default)
include = [
    "supernotify*",
] # package names should match these glob patterns (["*"] by default)
exclude = [
    "tests.components.supernotify.*",
] # exclude packages matching these glob patterns (empty by default)
namespaces = true # to disable scanning PEP 420 namespaces (true by default)

[dependency-groups]
dev=[
    "homeassistant-stubs",
    "pytest==9.0.3; python_full_version >= '3.14.2'",
    "pytest==9.0.0; python_full_version < '3.14.2'",
    "pytest-cov",
    "pytest-socket",
    "pytest-homeassistant-custom-component>=0.13.356;python_full_version >= '3.14.2'",
    "pytest-homeassistant-custom-component<0.13.348;python_full_version < '3.14.2'",
    "pytest-asyncio",
    "pytest-aiohttp==1.1.1; python_full_version >= '3.14.2'",
    "pytest-aiohttp<1.1.1; python_full_version < '3.14.2'",
    "pytest-unordered",
    "pytest-mock",
    "pytest-xdist",
    "pytest-icdiff",
    "types-aiofiles",
    "types-cachetools",
    "pre-commit",
    "pytest-httpserver",
    "ruff>=0.16.0; python_full_version >= '3.14.2'",
    "ruff<0.16.0; python_full_version < '3.14.2'",
    "codespell",
    "mypy",
    "genbadge[all]",
    # generic transport testing
    "notify-events",
    "aiontfy==0.8.2; python_full_version < '3.14.2'",
    "aiontfy==0.8.5; python_full_version >= '3.14.2'",
    "zeroconf==0.148.0; python_full_version < '3.14.2'",
    "zeroconf>=0.150.1; python_full_version >= '3.14.2'",

    # home assistant tts testing
    "mutagen",
    "ha-ffmpeg",

    # home assistant mobile push testing, and ntfy
    "PyTurboJPEG==2.5.0"
]
docs=[
    "mkdocs-material[imaging]",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-minify-plugin",
    "mkdocs-material-extensions",
    "pymdown-extensions",
    "mkdocs-autorefs",
    "mkdocs-coverage",
    "mkdocs-pagetree-plugin",
    "properdocs",
    "json-schema-for-humans",
    "mkdocs-gen-files",
    "voluptuous-openapi==0.2.0; python_full_version < '3.14.2'",
    "voluptuous-openapi>=0.3.0; python_full_version >= '3.14.2'",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-html-plugin",
    "mkdocs-meta-descriptions-plugin",
    "mike",
    "mkdocs-htmlproofer-plugin",
    "mkdocs[i18n]"
]

[project.optional-dependencies]


[tool.uv]
# Skip the 3.14.0-3.14.1 gap: HA 2026.3+ requires >=3.14.2, so those patch
# versions are unusable regardless.
prerelease = "if-necessary"
environments = [
    "python_full_version < '3.14'",
    "python_full_version >= '3.14.2'",
]
override-dependencies = [
    #"voluptuous-openapi==0.2.0"
    "homeassistant==2026.2.3; python_full_version < '3.14.2'",
    "homeassistant==2026.9.1; python_full_version >= '3.14.2'",
    "homeassistant-stubs==2026.2.3; python_full_version < '3.14.2'",
    "homeassistant-stubs==2026.9.1; python_full_version >= '3.14.2'",

]
exclude-newer = "5 days"
exclude-newer-package = { ruff="2 days",homeassistant=false,homeassistant-stubs=false }
add-bounds = "major"

[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py313"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".devcontainer",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".github",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true
ignore=[
    "BLE001", # Blind except
    "SIM117",  # Multiple with statements
    "PLW0108" # lay off the lambdas
]
unfixable = ["B"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = []
"**/{tests,docs}/*" = [
    "ANN201",
    "ANN204",
    "ANN001",
    "ARG002",
    "ARG001",
    "ANN202",
    "PT004",
    "ARG001",
    "SIM115",
]
"conftest.py" = [
    "ANN201",
    "ANN204",
    "ANN001",
    "ARG002",
    "ARG001",
    "ANN202",
    "PT004",
    "ARG001",
    "SIM115",
]


[tool.ruff.format]
preview = true

[tool.ty.src]
include = ["custom_components/supernotify","tests"]

[tool.ty.rules]
unused-type-ignore-comment="ignore"

[tool.codespell]
ignore-words-list = "HASS,hass,wee,alot,NotIn,datas,dof,dur,farenheit,hist,iff,ines,ist,lightsensor,mut,nd,pres,referer,ser,serie,te,technik,ue,uint,visability,wan,wanna,withing,astroid"
# Skip binary/data files, build artifacts, and non-English markdown (locale-named files and locale dirs)
skip = "*.csv,*.json,./.*,./site,./htmlcov,README.??.md,./README.??-??.md,./docs/??/*.md,./docs/??-??/*.md"
quiet-level = 2


[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = 1
log_level = "WARNING"
log_cli_level = "WARNING"
testpaths = ["tests"]
norecursedirs = [".git", "templates"]

addopts = [
    "-n 4",
    "--timeout=30",
    "-cov=custom_components/supernotify",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components.supernotify",
    "--cov-fail-under=80",
    "--allow-hosts=127.0.0.1,127.0.1.1,localhost,::1",
]
