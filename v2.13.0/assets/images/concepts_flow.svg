<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d">
  <title id="t">How Supernotify turns one notification into many</title>
  <desc id="d">An automation sends one notification to Supernotify. Supernotify works out who to notify, picks the deliveries to use, and sends an e-mail to Joe, push alerts to Joe's and Sue's phones, a text to Sue and an announcement on the kitchen speaker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9e9e9e"/>
    </marker>
    <g id="i-house" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13 0 L0 -12 L13 0"/><path d="M-9 -3 V11 H9 V-3"/><path d="M-3 11 V4 H3 V11"/>
    </g>
    <g id="i-bell" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 6 H10 L8 2 V-3 A8 8 0 0 0 -8 -3 V2 Z"/><path d="M-3 10 A3 3 0 0 0 3 10"/><path d="M0 -11 V-13"/>
    </g>
    <g id="i-person" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
      <circle cx="0" cy="-5" r="5"/><path d="M-10 11 A10 9 0 0 1 10 11"/>
    </g>
    <g id="i-speaker" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12 -4 H-6 L1 -10 V10 L-6 4 H-12 Z"/><path d="M5 -5 A7 7 0 0 1 5 5"/><path d="M8 -9 A12 12 0 0 1 8 9"/>
    </g>
    <g id="i-stack" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -12 L13 -6 L0 0 L-13 -6 Z"/><path d="M-13 0 L0 6 L13 0"/><path d="M-13 6 L0 12 L13 6"/>
    </g>
    <g id="i-mail" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-12" y="-8" width="24" height="16" rx="2"/><path d="M-11 -7 L0 2 L11 -7"/>
    </g>
    <g id="i-phone" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-7" y="-12" width="14" height="24" rx="3"/><path d="M-2 8 H2"/>
    </g>
    <g id="i-chat" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12 -9 H12 V5 H-2 L-7 10 V5 H-12 Z"/><path d="M-6 -2 H-6.01 M0 -2 H0.01 M6 -2 H6.01"/>
    </g>
  </defs>

  <style>
    text { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; fill: #808080; font-size: 15px; font-weight: 500; }
    .step { font-size: 17px; font-weight: 700; }
    .flow { fill: none; stroke: #9e9e9e; stroke-width: 2; marker-end: url(#arrow); }
  </style>

  <!-- automation -->
  <circle cx="70" cy="190" r="42" fill="#41BDF5"/>
  <use href="#i-house" transform="translate(70 190) scale(1.4)"/>
  <text x="70" y="256" text-anchor="middle">Automation</text>

  <path class="flow" d="M116 190 H166"/>

  <!-- supernotify -->
  <circle cx="215" cy="190" r="46" fill="#7E57C2"/>
  <use href="#i-bell" transform="translate(215 190) scale(1.5)"/>
  <text x="215" y="260" text-anchor="middle">Supernotify</text>

  <path class="flow" d="M265 190 H300"/>

  <!-- targets -->
  <circle cx="390" cy="190" r="86" fill="#26A69A" fill-opacity="0.15"/>
  <circle cx="390" cy="140" r="25" fill="#26A69A"/>
  <use href="#i-person" transform="translate(390 140)"/>
  <text x="390" y="183" text-anchor="middle">Joe</text>
  <circle cx="348" cy="212" r="25" fill="#26A69A"/>
  <use href="#i-person" transform="translate(348 212)"/>
  <text x="348" y="255" text-anchor="middle">Sue</text>
  <circle cx="432" cy="212" r="25" fill="#26A69A"/>
  <use href="#i-speaker" transform="translate(432 212)"/>
  <text x="432" y="255" text-anchor="middle">Kitchen</text>
  <text class="step" x="390" y="306" text-anchor="middle">① Who to notify</text>

  <path class="flow" d="M480 190 H528"/>

  <!-- deliveries -->
  <circle cx="575" cy="190" r="42" fill="#FB8C00"/>
  <use href="#i-stack" transform="translate(575 190) scale(1.4)"/>
  <text class="step" x="575" y="258" text-anchor="middle">② Deliveries</text>

  <!-- fan out -->
  <path class="flow" d="M619 190 C 690 190, 690 60, 758 60"/>
  <path class="flow" d="M619 190 C 690 190, 690 125, 758 125"/>
  <path class="flow" d="M619 190 H758"/>
  <path class="flow" d="M619 190 C 690 190, 690 255, 758 255"/>
  <path class="flow" d="M619 190 C 690 190, 690 320, 758 320"/>

  <!-- notifications -->
  <circle cx="788" cy="60" r="26" fill="#E53935"/>
  <use href="#i-mail" transform="translate(788 60)"/>
  <text x="824" y="65">E-mail to Joe</text>

  <circle cx="788" cy="125" r="26" fill="#1E88E5"/>
  <use href="#i-phone" transform="translate(788 125)"/>
  <text x="824" y="130">Push to Joe's phone</text>

  <circle cx="788" cy="190" r="26" fill="#1E88E5"/>
  <use href="#i-phone" transform="translate(788 190)"/>
  <text x="824" y="195">Push to Sue's phone</text>

  <circle cx="788" cy="255" r="26" fill="#43A047"/>
  <use href="#i-chat" transform="translate(788 255)"/>
  <text x="824" y="260">Text to Sue</text>

  <circle cx="788" cy="320" r="26" fill="#8E24AA"/>
  <use href="#i-speaker" transform="translate(788 320)"/>
  <text x="824" y="325">Announce in kitchen</text>

  <text class="step" x="870" y="378" text-anchor="middle">③ Notifications</text>
</svg>
