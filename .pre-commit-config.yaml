default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        args: [--unsafe]
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
  # ruff, ty and codespell from mise.toml, rather than versions of their own
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty check
        # the whole project with its pyproject.toml settings, as in CI
        entry: ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
        exclude: ^(docs/developer/diagrams/.*|README\.[a-z]{2}(-[A-Za-z]+)?\.md|docs/[a-z]{2}(-[A-Za-z]+)?/.+\.md)$
        exclude_types: [csv, json]
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        args:
          - --quiet
        files: ^(custom_components)/.+\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.1'
    hooks:
      - id: mypy
        args:
          - --pretty
          - --explicit-package-bases
          - --show-error-codes
          - --show-error-context
        exclude: ^(docgen|preview)/.*\.py$
        additional_dependencies:
          - homeassistant-stubs>=2026.10.0
          - pytest-homeassistant-custom-component>=0.13.356
          - pytest
          - types-PyYAML
          - types-aiofiles
          - beautifulsoup4
          - pytest_unordered
          - pytest_mock
          - pytest_httpserver
          - homeassistant_repl
  - repo: local
    hooks:
      - id: diagram-thumbnails
        name: diagram thumbnails
        # needs Chrome and the archify skill under .agents/, as for editing the diagrams
        entry: node docgen/diagram_thumbnails.mjs
        language: system
        files: ^docs/developer/diagrams/.+\.html$
