site_name: Home Assistant Supernotify
site_url: 'https://supernotify.rhizomatics.org.uk'
site_description: Advanced, concise, flexible notifications for Home Assistant

repo_name: rhizomatics/supernotify
repo_url: https://github.com/rhizomatics/supernotify
edit_uri: edit/main/docs/

theme:
  name: materialx
  custom_dir: docs/overrides
  highlightjs: true
  language: en
  logo: assets/images/logo-blank-256x256.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search
    - search.share
    - toc.follow
    - toc.integrate

extra:
  version:
    provider: mike
  alternate:
    - name: English
      link: ./
      lang: en
    - name: Deutsch
      link: de/
      lang: de
    - name: Español
      link: es/
      lang: es
    - name: Français
      link: fr/
      lang: fr
    - name: हिन्दी
      link: hi/
      lang: hi
    - name: Italiano
      link: it/
      lang: it
    - name: 日本語
      link: ja/
      lang: ja
    - name: Nederlands
      link: nl/
      lang: nl
    - name: Polski
      link: pl/
      lang: pl
    - name: Português
      link: pt/
      lang: pt
    - name: 中文（简体）
      link: zh-Hans/
      lang: zh-Hans
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhizomatics

plugins:
  - search
  - htmlproofer:
      skip_downloads: True
      validate_external_urls: False
      ignore_pages:
        - developer/reference/schemas/*
        - developer/classes.md
        - reference/transports.md
        - reference/options.md
      ignore_urls:
        - "*developer/reference/schemas/*"
        - ../developer/transports/*
        - ../configuration/options/*
        - ../transports/*
        - ../options/*
        - transports.md*
        - "*reference/options/*"
        - "*reference/transports/*"
        - schemas/json/*
        - options.md*

  - autorefs
  - redirects:
      redirect_maps:
        getting_started.md: quick_start/index.md
        concepts.md: quick_start/basic_concepts.md
        de/concepts.md: de/quick_start/basic_concepts.md
        es/concepts.md: es/quick_start/basic_concepts.md
        fr/concepts.md: fr/quick_start/basic_concepts.md
        hi/concepts.md: hi/quick_start/basic_concepts.md
        it/concepts.md: it/quick_start/basic_concepts.md
        ja/concepts.md: ja/quick_start/basic_concepts.md
        nl/concepts.md: nl/quick_start/basic_concepts.md
        pl/concepts.md: pl/quick_start/basic_concepts.md
        pt/concepts.md: pt/quick_start/basic_concepts.md
        zh-Hans/concepts.md: zh-Hans/quick_start/basic_concepts.md
  - pagetree
  - optimize
  - tags:
      shadow_tags:
        - Draft
        - Internal
  - meta-descriptions
  - llmstxt:
      base_url: https://supernotify.rhizomatics.org.uk/latest/
      preprocess: docgen/llms_preprocess.py
      markdown_description: >-
        Supernotify is a Home Assistant custom integration for unified notifications: send one
        notification and it is routed to many channels (deliveries) by transport, recipient
        and scenario, with configuration in YAML or the UI.

        JSON Schemas for validating configuration are published at
        https://supernotify.rhizomatics.org.uk/latest/developer/schemas/json/Full_Configuration.schema.json
        (complete YAML configuration) and
        https://supernotify.rhizomatics.org.uk/latest/developer/schemas/json/Notify_Action.schema.json
        (the notify action call). Schemas for individual objects, such as
        Delivery_Definition, Scenario_Definition, Recipient_Definition and Transport_Definition,
        sit alongside as <Name>.schema.json.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: Overview of what Supernotify does
          - quick_start/index.md: Quick Start overview
          - quick_start/installation.md: Install from HACS and set up from the UI, with no YAML
          - quick_start/first_notification.md: Send a first notification, to everyone, one person or the speakers
          - quick_start/next_steps.md: What to do next - automations, a dashboard, switches, targets and recipes
          - quick_start/basic_concepts.md: Basic concepts - targets, recipients, deliveries and priority
          - quick_start/advanced_concepts.md: Advanced concepts - transports, deliveries, scenarios, recipients and targets
          - quick_start/removing.md: Remove Supernotify and clean up what it leaves behind
          - faqs.md: Frequently asked questions, with short answers
        Using Supernotify:
          - usage/*.md
        Configuration:
          # fnmatch's * also matches /, so these pick up configuration/ and examples/ but leave
          # out examples/html_email_template.md, which is almost all HTML/CSS
          - configuration/[!e]*.md
          - configuration/e[!x]*.md
          - configuration/examples/m*.md
        Transports:
          - transports/*.md
        Recipes:
          - recipes/*.md
        Reference:
          - developer/reference/schemas/index.md: JSON Schemas for configuration and the notify action data
          - reference/transports.md: Table of notification transports and capabilities
        # changelog, roadmap, principles and RFCs left out - old or planned behaviour an agent would
        # take as current, and the changelog mentions everything so wins the help tool's page search

  - mike:
      alias_type: symlink
      canonical_version: latest
      version_selector: true
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - coverage:
      page_path: developer/reference/coverage
      html_report_dir: htmlcov
  - mkdocstrings:
      handlers:
      # See: https://mkdocstrings.github.io/python/usage/
        python:
          options:
            show_source: false
            show_root_heading: true
            summary: true
            show_inheritance_diagram: true
            docstring_section_style: spacy
  - gen-files:
      scripts:
        - docgen/schema_extractor.py
        - docgen/transport_table.py
        - docgen/options_table.py
        - docgen/render_templates.py

extra_javascript:
  - javascripts/markdown_actions.js
  - javascripts/nav_collapse.js
  - javascripts/tag_filter.js

hooks:
  - docgen/nav_order.py
  - docgen/tagged_index.py

watch:
  - custom_components/supernotify

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - sane_lists
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

not_in_nav: |
  de/
  es/
  fr/
  hi/
  it/
  ja/
  nl/
  pl/
  pt/
  zh-Hans/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
